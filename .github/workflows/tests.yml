name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify reusable-module imports
        run: python -c "import src.metrics, src.statistical_tests, src.power_analysis, src.segmentation"
      - name: Run tests
        run: pytest
